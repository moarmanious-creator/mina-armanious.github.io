<style>
/* MLEA Academic Hub — design tokens and components
   Identity: an academic ledger. Cool paper, deep ink, Nile blue; the one bold element is
   the progress ledger (attendance over study, one cell per lecture). Everything else is quiet. */

:root {
  /* Universität Hamburg corporate colours: Uni-Blau #0271bb, Uni-Rot #e2001a, Steingrau #3b515b */
  --uhh-blue: #0271bb;
  --uhh-red: #e2001a;
  --uhh-grey: #3b515b;
  --paper: #f4f6f7;
  --sheet: #ffffff;
  --ink: #1d2a30;
  --ink-2: #3b515b;
  --ink-3: #6a7c84;
  --rule: #dce2e5;
  --rule-2: #ebeff1;
  --nile: #0271bb;
  --nile-2: #e2eff9;
  --brass: #9a6b14;
  --brass-2: #f6ecd6;
  --sage: #3f7a52;
  --sage-2: #e3f0e6;
  --brick: #c8001a;
  --brick-2: #fde6e8;
  --focus: #0271bb;
  --c-micro: #2f5d8a;
  --c-ple: #7a4e9a;
  --c-ile: #0d6b5f;
  --c-qt: #a3561d;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --shadow: 0 1px 2px rgba(24, 34, 46, .06), 0 8px 24px rgba(24, 34, 46, .06);
  --side-w: 248px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f171b; --sheet: #172227; --ink: #e9eef0; --ink-2: #b7c4ca; --ink-3: #8a9ba3;
    --rule: #2b3a41; --rule-2: #223037; --nile: #5aaee6; --nile-2: #10324c; --brass: #d9a744; --brass-2: #3a2f17;
    --sage: #79c08f; --sage-2: #1c3324; --brick: #ff6f7d; --brick-2: #3f1a1f; --focus: #5aaee6;
    --c-micro: #6c9bd0; --c-ple: #b48ad3; --c-ile: #4fb5a3; --c-qt: #df9257;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f171b; --sheet: #172227; --ink: #e9eef0; --ink-2: #b7c4ca; --ink-3: #8a9ba3;
  --rule: #2b3a41; --rule-2: #223037; --nile: #5aaee6; --nile-2: #10324c; --brass: #d9a744; --brass-2: #3a2f17;
  --sage: #79c08f; --sage-2: #1c3324; --brick: #ff6f7d; --brick-2: #3f1a1f; --focus: #5aaee6;
  --c-micro: #6c9bd0; --c-ple: #b48ad3; --c-ile: #4fb5a3; --c-qt: #df9257;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; margin: 0; letter-spacing: -.005em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 .7em; }
a { color: var(--nile); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .86rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ── Shell ───────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule); padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--nile); text-decoration: none; padding: 4px 8px 10px; }
.brand span { color: var(--ink); font-size: .98rem; }
.brand strong { font-family: var(--serif); font-size: 1.12rem; margin-right: 2px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { margin-top: 12px; padding: 0 10px 4px; font-size: .8rem; color: var(--ink-3); font-weight: 600; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav-link:hover { background: var(--rule-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--nile-2); color: var(--nile); }
.nav-link svg { flex: none; }
.nav-link .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.nav-link .count { margin-left: auto; font-size: .78rem; color: var(--ink-3); }
.nav-course { align-items: flex-start; }
.nav-course .nc-name { display: block; line-height: 1.3; }
.nav-course .mini-ledger { margin-top: 5px; }
.side-foot { margin-top: auto; border-top: 1px solid var(--rule); padding-top: 12px; font-size: .86rem; }
.side-foot .who { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--nile); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: .85rem; flex: none; }
.role-tag { font-size: .74rem; padding: 1px 7px; border-radius: 999px; background: var(--brass-2); color: var(--brass); font-weight: 600; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 14px 28px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.topbar h1 { font-size: 1.35rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; color: var(--ink-3); width: 280px; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.search:focus-within { border-color: var(--focus); }
.search-results { position: absolute; right: 28px; top: 60px; width: min(440px, calc(100vw - 32px)); max-height: 60vh; overflow: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 6px; }
.search-results a { display: block; padding: 8px 10px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); }
.search-results a:hover, .search-results a:focus { background: var(--rule-2); }
.search-results .kind { font-size: .75rem; color: var(--ink-3); }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--rule-2); color: var(--ink); }
.only-mobile { display: none; }
.banner { margin: 14px 28px 0; padding: 10px 14px; border-radius: var(--r-md); background: var(--brass-2); color: var(--ink); font-size: .9rem; }
#view { padding: 24px 28px 120px; max-width: 1240px; width: 100%; outline: 0; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 50; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .side.open { transform: none; }
  .only-mobile { display: inline-grid; }
  .topbar { padding: 10px 16px; }
  .search { width: 38px; height: 38px; padding: 0; justify-content: center; border-color: transparent; background: transparent; }
  .search:focus-within { padding: 6px 12px; justify-content: flex-start; background: var(--sheet); border-color: var(--focus); height: auto; }
  .search:focus-within { position: absolute; left: 16px; right: 16px; width: auto; z-index: 3; }
  .search input { width: 0; }
  .search:focus-within input { width: 100%; }
  .search-results { right: 16px; top: 54px; }
  .banner { margin: 12px 16px 0; }
  #view { padding: 18px 16px 120px; }
}
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .38); z-index: 40; }

/* ── Building blocks ─────────────────────────────────── */
.section { margin-bottom: 30px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head p { margin: 4px 0 0; color: var(--ink-3); font-size: .9rem; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 18px 20px; }
.sheet.flush { padding: 0; overflow: hidden; }
.grid { display: grid; gap: 18px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.side-r { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); }
@media (max-width: 1080px) { .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.side-r { grid-template-columns: 1fr; } }
@media (max-width: 680px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }
.stack > * + * { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hr { height: 1px; background: var(--rule); margin: 16px 0; border: 0; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none; line-height: 1.25; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--nile); border-color: var(--nile); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0d1a22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0d1a22; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--rule-2); }
.btn.danger { color: var(--brick); }
.btn.sm { padding: 5px 10px; font-size: .86rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--sage-2); color: var(--sage); }
.pill.warn { background: var(--brass-2); color: var(--brass); }
.pill.bad { background: var(--brick-2); color: var(--brick); }
.pill.info { background: var(--nile-2); color: var(--nile); }
.pill .sw { width: 8px; height: 8px; border-radius: 2px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; overflow-x: auto; }
.tab { padding: 9px 14px; border: 0; background: none; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--nile); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: var(--r-sm); overflow: hidden; background: var(--sheet); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--nile-2); color: var(--nile); }

label.field { display: block; font-size: .86rem; color: var(--ink-2); font-weight: 500; }
label.field > span { display: block; margin-bottom: 4px; }
.input, select.input, textarea.input { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--sheet); color: var(--ink); }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.5; }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .wide { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.check { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--nile); flex: none; }

table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.data th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: .8rem; padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; background: var(--sheet); position: sticky; top: 0; }
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--rule-2); }
.table-wrap { overflow-x: auto; }
.empty { padding: 26px; text-align: center; color: var(--ink-3); }
.empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-weight: 600; }

/* Information Required — official gaps */
.info-req { border-left: 3px solid var(--brass); background: var(--brass-2); padding: 10px 14px; border-radius: 0 var(--r-sm) var(--r-sm) 0; font-size: .88rem; }
.info-req strong { color: var(--brass); }
.info-req ul { margin: 4px 0 0; padding-left: 18px; }
.src { font-size: .78rem; color: var(--ink-3); }
.src::before { content: "Source: "; }

/* ── The progress ledger (signature element) ─────────── */
.ledger { display: grid; gap: 14px; }
.ledger-row { display: grid; grid-template-columns: 190px 1fr 92px; align-items: center; gap: 14px; }
.ledger-row .lr-name { font-weight: 600; line-height: 1.25; text-decoration: none; color: var(--ink); }
.ledger-row .lr-name small { display: block; font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(16px, 1fr); gap: 3px; }
.cell { height: 34px; border-radius: 4px; overflow: hidden; display: grid; grid-template-rows: 1fr 1fr; border: 1px solid var(--rule); background: var(--sheet); position: relative; cursor: pointer; padding: 0; }
.cell:hover { border-color: var(--ink-3); }
.cell .a, .cell .s { display: block; }
.cell .s { border-top: 1px solid var(--rule-2); }
.cell.future { border-style: dashed; }
.cell.today { box-shadow: 0 0 0 2px var(--nile); }
.a-full { background: var(--course); }
.a-half { background: linear-gradient(90deg, var(--course) 50%, transparent 50%); }
.a-miss { background: repeating-linear-gradient(135deg, var(--brick) 0 3px, transparent 3px 7px); opacity: .7; }
.s-p0 { background: transparent; }
.s-p1 { background: color-mix(in srgb, var(--course) 30%, transparent); }
.s-p2 { background: color-mix(in srgb, var(--course) 60%, transparent); }
.s-p3 { background: var(--course); }
.ledger-row .lr-fig { text-align: right; font-size: .82rem; color: var(--ink-3); line-height: 1.35; }
.ledger-row .lr-fig b { color: var(--ink); font-size: 1rem; }
.ledger-key { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-3); margin-top: 12px; }
.ledger-key i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--rule); }
.mini-ledger { display: flex; gap: 2px; }
.mini-ledger i { width: 7px; height: 9px; border-radius: 1.5px; background: var(--rule); display: block; }
.mini-ledger i.done { background: var(--course); }
.mini-ledger i.half { background: color-mix(in srgb, var(--course) 45%, var(--rule)); }
@media (max-width: 680px) {
  .ledger-row { grid-template-columns: 1fr auto; }
  .ledger-row .cells { grid-column: 1 / -1; grid-row: 2; }
  .cell { height: 28px; }
}

/* Figures strip */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); border: 1px solid var(--rule); border-radius: var(--r-lg); background: var(--sheet); overflow: hidden; }

    ...S.courses.flatMap((c) => (c.info_required || []).map((r) => ({ c: c.id, where: "Course", r }))),
    ...S.sessions.flatMap((s) => (s.info_required || []).map((r) => ({ c: s.course_id, where: sessionLabel(s), r }))),
    ...S.assessments.flatMap((a) => (a.info_required || []).map((r) => ({ c: a.course_id, where: a.title, r }))),
  ];
  view.innerHTML = `
    <div class="tabs" role="tablist">${[["sessions", "Lectures & dates"], ["assessments", "Assessments"], ["courses", "Courses"], ["import", "Import & source documents"], ["missing", `Information required (${allReq.length})`], ["log", "Change log"]]
      .map(([k, l]) => `<button class="tab" role="tab" aria-selected="${ADM.tab === k}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${["sessions", "assessments", "courses"].includes(ADM.tab) ? `<div class="row" style="margin-bottom:14px"><select class="input" data-course style="width:auto" aria-label="Course">${S.courses.map((c) => `<option value="${c.id}" ${ADM.course === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>${ADM.tab !== "courses" ? `<button class="btn primary" data-add>Add ${ADM.tab === "sessions" ? "session" : "assessment"}</button>` : ""}</div>` : ""}
    <div id="admBody"></div>`;
  $$(".tab", view).forEach((b) => b.addEventListener("click", () => { ADM.tab = b.dataset.tab; renderAcademicData(view); }));
  $("[data-course]", view)?.addEventListener("change", (e) => { ADM.course = e.target.value; renderAcademicData(view); });
  const body = $("#admBody", view);
  const again = async () => { await loadOfficial(); renderAcademicData(view); };
  $("[data-add]", view)?.addEventListener("click", () => ADM.tab === "sessions" ? editSession({ course_id: ADM.course, kind: "lecture", delivery: "tbc", seq: Math.max(0, ...S.sessions.filter((s) => s.course_id === ADM.course).map((s) => s.seq)) + 1 }, again) : editAssessment({ course_id: ADM.course, type: "assignment" }, again));

  if (ADM.tab === "sessions") {
    const list = S.sessions.filter((s) => s.course_id === ADM.course).sort((a, b) => (a.scheduled_date || "9999").localeCompare(b.scheduled_date || "9999") || a.seq - b.seq);
    body.innerHTML = `<div class="sheet flush"><div class="table-wrap"><table class="data"><thead><tr><th>Session</th><th>Date</th><th>Time</th><th>Format</th><th>Lecturer</th><th>Flags</th><th></th></tr></thead><tbody>
      ${list.map((s) => `<tr${s.cancelled ? ' style="opacity:.55"' : ""}><td><strong>${esc(sessionLabel(s))}</strong><div class="small">${esc(s.title)}</div></td><td class="num">${s.scheduled_date ? fmtDate(s.scheduled_date) : "—"}</td><td class="small">${s.start_time ? s.start_time.slice(0, 5) + (s.end_time ? "–" + s.end_time.slice(0, 5) : "") : "—"}</td><td class="small">${esc(DELIVERY[s.delivery])}</td><td class="small">${esc(lecturerName(s.lecturer_id) || "—")}</td><td>${s.cancelled ? `<span class="pill bad">Cancelled</span>` : ""}${s.info_required?.length ? `<span class="pill warn">${s.info_required.length} to confirm</span>` : ""}</td><td><button class="btn sm" data-edit="${s.id}">Edit</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
    $$("[data-edit]", body).forEach((b) => b.addEventListener("click", () => editSession(S.sessions.find((s) => s.id === b.dataset.edit), again)));
  } else if (ADM.tab === "assessments") {
    const list = S.assessments.filter((a) => a.course_id === ADM.course);
    body.innerHTML = `<div class="sheet flush"><table class="data"><thead><tr><th>Assessment</th><th>Type</th><th>Weight</th><th>Deadline</th><th></th></tr></thead><tbody>${list.map((a) => `<tr><td><strong>${esc(a.title)}</strong>${a.info_required?.length ? ` <span class="pill warn">${a.info_required.length} to confirm</span>` : ""}</td><td class="small">${esc(a.type.replace("_", " "))}</td><td class="small">${esc(a.weight || "—")}</td><td>${a.due_date ? fmtDate(a.due_date) : "—"}</td><td><button class="btn sm" data-edit="${a.id}">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
    $$("[data-edit]", body).forEach((b) => b.addEventListener("click", () => editAssessment(S.assessments.find((a) => a.id === b.dataset.edit), again)));
  } else if (ADM.tab === "courses") {
    editCourseInline(body, course(ADM.course), again);
  } else if (ADM.tab === "import") {
    importTab(body, again);
  } else if (ADM.tab === "missing") {
    body.innerHTML = `<p class="muted small">Everything the official documents leave open or contradict. Students see these flags too, so they don't rely on unconfirmed details. Remove a flag by editing the item once the programme confirms it.</p>
      <div class="sheet flush"><table class="data"><tbody>${allReq.map((x) => `<tr><td>${coursePill(x.c)}</td><td class="small"><strong>${esc(x.where)}</strong></td><td class="small">${esc(x.r)}</td></tr>`).join("")}</tbody></table></div>`;
  } else if (ADM.tab === "log") {
    body.innerHTML = `<div class="loading">Loading…</div>`;
    sb.from("change_log").select("id, table_name, record_id, action, changed_by, changed_at, new_data, old_data").order("id", { ascending: false }).limit(100).then(({ data, error }) => {
      if (error) return (body.innerHTML = `<div class="empty">${esc(error.message)}</div>`);
      body.innerHTML = `<div class="sheet flush"><div class="table-wrap"><table class="data"><thead><tr><th>When</th><th>What</th><th>Change</th></tr></thead><tbody>${(data || []).map((r) => {
        const n = r.new_data || {}, o = r.old_data || {};
        const changed = r.action === "UPDATE" ? Object.keys(n).filter((k) => !["updated_at"].includes(k) && JSON.stringify(n[k]) !== JSON.stringify(o[k])) : [];
        return `<tr><td class="small num">${new Date(r.changed_at).toLocaleString("en-GB", { timeZone: "Africa/Cairo", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td><td class="small">${esc(r.action.toLowerCase())} ${esc(r.table_name)}<div class="muted">${esc(n.title || n.name || o.title || o.name || r.record_id)}</div></td><td class="small">${changed.length ? changed.map((k) => `<div><strong>${esc(k)}</strong>: ${esc(short(o[k]))} → ${esc(short(n[k]))}</div>`).join("") : r.action === "UPDATE" ? "<span class='muted'>No field changes</span>" : ""}</td></tr>`;
      }).join("")}</tbody></table></div></div>`;
    });
  }
}
const short = (v) => { const s = v == null ? "∅" : typeof v === "string" ? v : JSON.stringify(v); return s.length > 80 ? s.slice(0, 77) + "…" : s; };
const lines = (v) => (v || "").split("\n").map((x) => x.trim()).filter(Boolean);

      <label class="field"><span>Kind</span><select class="input" name="kind">${["lecture", "review", "tutorial", "presentation"].map((k) => `<option ${s.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select></label>
      <label class="field"><span>Number</span><input class="input" type="number" name="seq" required value="${s.seq ?? ""}"></label>
      <label class="field wide"><span>Label (as written in the official document)</span><input class="input" name="label" value="${esc(s.label || "")}" placeholder="e.g. Lecture 4"></label>
      <label class="field wide"><span>Title</span><input class="input" name="title" required value="${esc(s.title || "")}"></label>
      <label class="field"><span>Date</span><input class="input" type="date" name="scheduled_date" value="${esc(s.scheduled_date || "")}"></label>
      <label class="field"><span>Format</span><select class="input" name="delivery">${Object.entries(DELIVERY).map(([k, l]) => `<option value="${k}" ${s.delivery === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field"><span>Start time</span><input class="input" type="time" name="start_time" value="${esc(s.start_time?.slice(0, 5) || "")}"></label>
      <label class="field"><span>End time</span><input class="input" type="time" name="end_time" value="${esc(s.end_time?.slice(0, 5) || "")}"></label>
      <label class="field"><span>Location</span><input class="input" name="location" value="${esc(s.location || "")}"></label>
      <label class="field"><span>Lecturer</span><select class="input" name="lecturer_id"><option value="">Not stated</option>${S.lecturers.map((l) => `<option value="${l.id}" ${s.lecturer_id === l.id ? "selected" : ""}>${esc(lecturerName(l.id))}</option>`).join("")}</select></label>
      <label class="field wide"><span>Topics (one per line)</span><textarea class="input" name="topics">${esc((s.topics || []).join("\n"))}</textarea></label>
      <label class="field wide"><span>Readings</span><input class="input" name="readings" value="${esc(s.readings || "")}"></label>
      <label class="field wide"><span>Recording link</span><input class="input" type="url" name="recording_url" value="${esc(s.recording_url || "")}"></label>
      <label class="field wide"><span>Information required (one per line — clear once confirmed)</span><textarea class="input" name="info_required" style="min-height:60px">${esc((s.info_required || []).join("\n"))}</textarea></label>
      <label class="field"><span>Source document</span><select class="input" name="source_ref"><option value="">None</option>${S.sources.map((d) => `<option value="${d.id}" ${s.source_ref === d.id ? "selected" : ""}>${esc(d.id)}</option>`).join("")}</select></label>
      <label class="check" style="align-self:end"><input type="checkbox" name="cancelled" ${s.cancelled ? "checked" : ""}> Cancelled</label>
    </form>`;
    const form = $("form", body);
    foot.innerHTML = `${isNew ? "" : `<button class="btn danger" data-del style="margin-right:auto">Delete</button>`}<button class="btn" data-c>Cancel</button><button class="btn primary" data-s>Save for all students</button>`;
    foot.querySelector("[data-c]").onclick = close;
    foot.querySelector("[data-del]")?.addEventListener("click", async () => {
      if (!(await confirmDialog("Delete this session for everyone? Students' attendance and progress for it will also be deleted. Consider marking it Cancelled instead."))) return;
      const { error } = await sb.from("sessions").delete().eq("id", s.id);
      if (error) return errToast(error);
      close(); toast("Session deleted"); after();
    });
    foot.querySelector("[data-s]").onclick = async () => {
      if (!form.reportValidity()) return;
      const f = readForm(form);
      const row = { course_id: s.course_id, kind: f.kind, seq: f.seq, label: f.label, title: f.title, scheduled_date: f.scheduled_date, delivery: f.delivery,
        start_time: f.start_time, end_time: f.end_time, location: f.location, lecturer_id: f.lecturer_id, topics: lines(f.topics), readings: f.readings,
        recording_url: f.recording_url, info_required: lines(f.info_required), source_ref: f.source_ref, cancelled: !!f.cancelled };
      const { error } = isNew ? await sb.from("sessions").insert(row) : await sb.from("sessions").update(row).eq("id", s.id);
      if (error) return errToast(error);
      close(); toast("Saved. Every student sees the change."); after();
    };
  }, { wide: true });
}

function importTab(body, after) {
  body.innerHTML = `<div class="grid two">
    <div class="sheet"><h3>Load or update the academic structure</h3>
      <p class="small">Import a structured file in the Hub format (<code>mlea-hub-official/1</code>). Existing courses, sessions and assessments are matched and updated; student progress is kept. Every change is written to the change log.</p>
      <div class="row" style="margin:10px 0"><button class="btn primary" data-bundled>Load the 2026/27 first-semester data</button><label class="btn">Choose a JSON file<input type="file" accept=".json,application/json" hidden data-json></label><button class="btn ghost" type="button" data-dljson>Download the current file</button></div>
      <p class="small muted">The bundled file was extracted from the four syllabi and the Microeconomics timetable, with every gap flagged as Information required. To change the structure in bulk, download it, edit it, and import it again.</p>
      <div data-out class="small"></div></div>
    <div class="sheet"><h3>Source documents</h3>
      <p class="small">Upload the official PDFs (syllabi, timetables, programme emails). They are stored for staff and students to consult, and their text becomes searchable for the AI assistant.</p>
      <ul class="plist">${S.sources.map((d) => `<li><span class="bar"></span><div><div class="t">${esc(d.title)}</div><div class="d">${esc(d.id)}${d.file_name ? " · " + esc(d.file_name) : ""} · ${d.storage_path ? "file uploaded" : `<span style="color:var(--brass)">file not uploaded yet</span>`}</div></div><label class="btn sm">Upload PDF<input type="file" hidden accept=".pdf,.docx,.txt" data-src="${esc(d.id)}"></label></li>`).join("")}</ul>
      <button class="btn sm" data-newsrc style="margin-top:10px">Add another source document</button></div></div>`;
  const out = $("[data-out]", body);
  const run = async (json) => {
    try {
      const dry = await sb.rpc("import_official", { data: json, dry_run: true });
      let preview = null;
      if (dry.error && dry.error.message === "DRY_RUN") preview = JSON.parse(dry.error.details || "{}");
      else if (dry.error) throw dry.error;
      const ok = await confirmDialog(`This will create or update ${preview?.courses ?? "?"} courses, ${preview?.sessions ?? "?"} sessions, ${preview?.assessments ?? "?"} assessments and ${preview?.materials ?? "?"} materials for every student.${preview?.warnings?.length ? " Warnings: " + preview.warnings.join("; ") : ""}`, { ok: "Import", danger: false });
      if (!ok) return;
      const { data, error } = await sb.rpc("import_official", { data: json });
      if (error) throw error;
      out.innerHTML = `<div class="info-req" style="border-color:var(--sage);background:var(--sage-2)"><strong style="color:var(--sage)">Imported.</strong> ${esc(JSON.stringify(data))}</div>`;
      toast("Academic data imported"); after();
    } catch (e) { errToast(e); out.textContent = e.message; }
  };
  $("[data-bundled]", body).addEventListener("click", async () => { try { run(window.__HUB_OFFICIAL_DATA || await (await fetch("data/official-data.json", { cache: "no-store" })).json()); } catch (e) { errToast(e); } });
  $("[data-dljson]", body).addEventListener("click", async () => {
    try { const d = window.__HUB_OFFICIAL_DATA || await (await fetch("data/official-data.json", { cache: "no-store" })).json(); download("official-data.json", JSON.stringify(d, null, 2), "application/json"); } catch (e) { errToast(e); }
  });
  $("[data-json]", body).addEventListener("change", async (e) => { try { run(JSON.parse(await e.target.files[0].text())); } catch (er) { errToast(er, "That file isn't valid JSON"); } });
  $$("[data-src]", body).forEach((inp) => inp.addEventListener("change", async () => {
    const file = inp.files[0]; const id = inp.dataset.src;
    try {
      const path = `sources/${id}-${file.name.replace(/[^\w.\-]+/g, "_")}`;
      const up = await sb.storage.from("official").upload(path, file, { upsert: true, contentType: file.type || "application/pdf" });
      if (up.error) throw up.error;
      const text = await extractText(file);
      const { error } = await sb.from("source_documents").update({ storage_path: path, file_name: file.name, extracted_text: text ? text.slice(0, 500000) : null, imported_by: S.user.id, imported_at: new Date().toISOString() }).eq("id", id);
      if (error) throw error;
      await sb.from("doc_chunks").delete().eq("source_doc_id", id);
      if (text) {
        const rows = chunk(text).map((c, i) => ({ source_doc_id: id, title: S.sources.find((d) => d.id === id)?.title || id, chunk_index: i, content: c }));
        for (let i = 0; i < rows.length; i += 100) { const r = await sb.from("doc_chunks").insert(rows.slice(i, i + 100)); if (r.error) throw r.error; }
      }
      toast(text ? "Uploaded and made searchable" : "Uploaded (no text could be read)"); after();
    } catch (e) { errToast(e); }
  }));
  $("[data-newsrc]", body).addEventListener("click", () => openModal("Add source document", (b, foot, close) => {
    b.innerHTML = `<form class="form-grid"><label class="field"><span>Reference ID</span><input class="input" name="id" required pattern="[A-Z0-9\\-]+" placeholder="SRC-EMAIL-1103"></label><label class="field"><span>File name</span><input class="input" name="file_name"></label><label class="field wide"><span>Title</span><input class="input" name="title" required placeholder="Programme email, 3 Nov 2026: exam dates"></label></form>`;
    foot.innerHTML = `<button class="btn" data-c>Cancel</button><button class="btn primary" data-s>Add</button>`;
    foot.querySelector("[data-c]").onclick = close;
    foot.querySelector("[data-s]").onclick = async () => {
      const form = $("form", b); if (!form.reportValidity()) return;
      const { error } = await sb.from("source_documents").insert(readForm(form)); if (error) return errToast(error);
      close(); after();
    };
  }));
}

    } else {
      const [title, fn] = ROUTES[r.path];
      $("#pageTitle").textContent = title;
      document.title = `${title} · MLEA Academic Hub`;
      fn(view);
    }
    nav();
    closeMenu();
  } catch (e) { errToast(e); console.error(e); }
  finally { rendering = false; }
}
const rerender = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };

function closeMenu() { $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); $(".scrim.menu")?.remove(); }
function wireShell() {
  $("#menuBtn").addEventListener("click", () => {
    const side = $("#side");
    side.classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true");
    const scrim = document.createElement("div"); scrim.className = "scrim menu"; scrim.addEventListener("click", closeMenu); document.body.appendChild(scrim);
  });
  $("#themeBtn").addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("hub-theme", document.documentElement.dataset.theme); } catch { /* ignore */ }
    rerender();
  });
  window.addEventListener("hashchange", () => { render(); $("#view").focus({ preventScroll: true }); window.scrollTo(0, 0); });
  window.addEventListener("hub:changed", () => { if ($("#drawer").hidden && $("#modal").hidden) rerender(); else pendingRerender = true; });
  window.addEventListener("hub:task", (e) => openTask(e.detail, rerender));
  window.addEventListener("hub:preview", (e) => preview(e.detail));
  // Re-render after a drawer or dialog closes if something changed underneath it.
  let pendingRerender = false;
  new MutationObserver(() => { if (pendingRerender && $("#drawer").hidden && $("#modal").hidden) { pendingRerender = false; rerender(); } })
    .observe(document.body, { subtree: true, attributes: true, attributeFilter: ["hidden"] });

  // Delegated openers used across views.
  document.addEventListener("click", (e) => {
    const s = e.target.closest("[data-open-session]");
    if (s) { e.preventDefault(); return openSession(s.dataset.openSession); }
    const t = e.target.closest("[data-open-task]");
    if (t) { e.preventDefault(); return openTask(findTask(t.dataset.openTask), rerender); }
    const of = e.target.closest("[data-official-file]");
    if (of) { e.preventDefault(); return openFile("official", of.dataset.officialFile); }
    const mf = e.target.closest("[data-my-file]");
    if (mf) { e.preventDefault(); return openFile("mine", mf.dataset.myFile); }
  });

  // Global search across lectures, tasks, files and notes.
  const input = $("#globalSearch"), box = $("#searchResults");
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    const hit = (s) => (s || "").toLowerCase().includes(q);
    const res = [
      ...S.sessions.filter((s) => hit(s.title) || (s.topics || []).some(hit) || hit(s.label)).map((s) => ({ kind: "Lecture", label: `${S.courses.find((c) => c.id === s.course_id)?.short_name}: ${s.label || ""} ${s.title}`, attr: `data-open-session="${s.id}"` })),
      ...S.assessments.filter((a) => hit(a.title)).map((a) => ({ kind: "Assessment", label: a.title, attr: `data-open-task="a:${a.id}"` })),
      ...S.tasks.filter((t) => !t.assessment_id && hit(t.title)).map((t) => ({ kind: "Task", label: t.title, attr: `data-open-task="${t.id}"` })),
      ...S.attachments.filter((a) => hit(a.name) || hit(a.description)).map((a) => ({ kind: "My file", label: a.name, attr: `data-my-file="${a.id}"` })),
      ...S.materials.filter((m) => hit(m.title)).map((m) => ({ kind: "Course material", label: m.title, attr: m.storage_path ? `data-official-file="${m.id}"` : `data-url="${esc(m.url || "")}"` })),
      ...S.notes.filter((n) => hit(n.title) || hit(n.body)).map(() => ({ kind: "Note", label: "Open My notes", attr: `data-href="#/documents"` })),
    ].slice(0, 14);
    box.innerHTML = res.length ? res.map((r) => `<a href="#" ${r.attr}><span class="kind">${esc(r.kind)}</span><br>${esc(r.label)}</a>`).join("") : `<div class="muted small" style="padding:10px">No matches.</div>`;
    box.hidden = false;
  });
  box.addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a) return;
    if (a.dataset.url) { e.preventDefault(); window.open(a.dataset.url, "_blank", "noopener"); }
    if (a.dataset.href) { e.preventDefault(); location.hash = a.dataset.href; }
    box.hidden = true; input.value = "";
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search") && !e.target.closest("#searchResults")) box.hidden = true; });
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") { box.hidden = true; input.blur(); } });

  // Keep "today" right if the tab stays open past midnight; refresh personal data when returning.
  document.addEventListener("visibilitychange", async () => {
    if (document.visibilityState !== "visible" || !S.loaded) return;
    const t = todayISO();
    try { await loadPersonal(); } catch { /* offline: keep what we have */ }
    if (t !== S.today) S.today = t;
    if ($("#drawer").hidden && $("#modal").hidden) rerender();
  });
}

function showBanner(html) { const b = $("#banner"); b.innerHTML = html; b.hidden = false; }

async function start(session) {
  S.user = session.user;
  hideAuth();
  $("#shell").hidden = false;
  $("#view").innerHTML = `<div class="loading">Loading your records…</div>`;
  try {
    const p = await loadProfile();
    if (!p) { showBanner("Your account exists but has no profile yet. Sign out and in again, or ask the programme admin."); return; }
    if (!p.active) { $("#view").innerHTML = `<div class="empty"><strong>This account has been deactivated.</strong>Contact the programme admin to restore access.</div>`; return; }
    await loadAll();
    if (!S.courses.length) showBanner(isStaff() ? `No academic data yet. Open <a href="#/data">Academic data → Import</a> and load the 2026/27 data.` : "The programme hasn't published the courses yet. Check back soon.");
    render();
    initAI();
    startReminders();
  } catch (e) {
    console.error(e);
    const m = String(e.message || e);
    $("#view").innerHTML = /relation .* does not exist|schema cache|Could not find the table/i.test(m)
      ? `<div class="info-req"><strong>The database hasn't been set up for the Hub yet.</strong> The programme admin needs to run <code>supabase/hub_setup.sql</code> in the Supabase SQL Editor (see DEPLOY.md).</div>`
      : `<div class="empty"><strong>Couldn't load your records.</strong>${esc(m)}<br><button class="btn" onclick="location.reload()" style="margin-top:10px">Try again</button></div>`;
  }
}

async function boot() {
  if (!configured) {
    const web = "https://moarmanious-creator.github.io/mina-armanious.github.io/mlea/hub/";
    // A file preview (phone file viewers, mail and chat apps) blocks the sign-in service; point people to the web address.
    document.body.innerHTML = window.supabase
      ? `<div class="empty" style="padding:60px"><strong>The Hub isn't connected to its database.</strong>Set SUPABASE_URL and SUPABASE_ANON_KEY in config.js.</div>`
      : `<div class="empty" style="padding:48px 24px;max-width:520px;margin:0 auto"><strong>Open the Hub in your browser</strong>This preview can't connect to the sign-in service. Open the link below in Safari or Chrome, then use Share → Add to Home Screen to keep it like an app.<p style="margin-top:16px"><a class="btn primary" href="${web}" target="_blank" rel="noopener">Open MLEA Academic Hub</a></p><p class="small muted" style="word-break:break-all">${web}</p><p class="small muted" dir="rtl" lang="ar">المعاينة دي مش بتتصل بالسيرفر. افتح الرابط في Safari أو Chrome، وبعدها مشاركة ← إضافة إلى الشاشة الرئيسية.</p></div>`;
    return;
  }
  wireShell();
  const sp = document.getElementById("sidePartners"); if (sp) sp.innerHTML = partnerLogos();
  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") { $("#shell").hidden = true; renderAuth("setpw"); return; }
    if (event === "SIGNED_OUT") { location.reload(); return; }
    if (event === "SIGNED_IN" && session && !started) {
      if (window.__authLinkType === "invite" || window.__authLinkType === "recovery") { $("#shell").hidden = true; renderAuth("setpw"); return; }
      started = true; start(session);
    }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session && !started) {
    if (window.__authLinkType === "invite" || window.__authLinkType === "recovery") { renderAuth("setpw"); return; }
    started = true; start(session);
  } else if (!session) {
    const err = new URLSearchParams(location.hash.slice(1)).get("error_description");
    renderAuth("signin", err ? "!" + err.replace(/\+/g, " ") : "");
  }
}
boot().catch((e) => { console.error(e); toast("The Hub failed to start. Reload the page.", "err"); });

return {  };
})();
</script>
