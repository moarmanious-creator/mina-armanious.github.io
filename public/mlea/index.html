<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MLEA Academic Desk</title>
<meta name="description" content="Study planner for the MLEA programme: lectures, deadlines, exams, grades and focus time.">
<meta name="theme-color" content="#0d6b5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MLEA Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="authHost"></div>
<div id="appRoot" hidden>
<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <div class="mainc">
    <header class="appbar"><div class="wrap"><h1 id="viewTitle">MLEA</h1>
      <button class="ib" id="timerBtn" aria-label="Focus timer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg></button>
      <button class="ib" id="bellBtn" aria-label="Alerts"></button>
      <button class="ib avatar" id="acctBtn" aria-label="Account"></button></div></header>
    <div class="wrap"><div class="status-line" id="statusLine">Connecting to your saved records…</div><main id="view"></main></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<button class="fab" id="fab" aria-label="Add"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="timerHost"></div>
<div id="drawerHost"></div>
<div id="toastHost"></div>
<input type="file" id="matInput" hidden accept=".pdf,.pptx,.docx">
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
